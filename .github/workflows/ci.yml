name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install both SDK package names
        if: matrix.node-version == 22
        run: |
          packages="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$packages"
          node verify/pack-koreaaitel.mjs "$packages"
          cd "$(mktemp -d)"
          npm install --ignore-scripts "$packages"/teamlearners-clawops-*.tgz "$packages"/koreaaitel-sdk-*.tgz
          node -e '
            for (const name of ["@teamlearners/clawops", "@koreaaitel/sdk"]) {
              if (typeof require(name).ClawOps !== "function") throw Error(name);
              for (const path of ["/agent", "/agent/livekit", "/solapi"]) require.resolve(name + path);
            }
          '
          node --input-type=module -e '
            import { ClawOps as Legacy } from "@teamlearners/clawops";
            import { ClawOps as Branded } from "@koreaaitel/sdk";
            if (typeof Legacy !== "function" || typeof Branded !== "function") throw Error("SDK exports");
          '

  livekit-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Install real optional LiveKit dependencies
        run: |
          npm install --save-dev --package-lock=false @livekit/agents@1.5.0 @livekit/rtc-node@0.13.35
          node -e "require.resolve('@livekit/rtc-node')"
      - run: npm run build
      - name: Real 8kHz and 16kHz media contract (no mocks)
        run: node verify/livekit-media.mjs
