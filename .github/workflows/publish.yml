name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes

  publish-koreaaitel:
    needs: publish
    if: >-
      ${{ !cancelled() && (needs.publish.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the source matches the existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false
          git fetch --depth=1 origin "refs/tags/$tag"
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/publish.yml'
      - run: npm ci
      - run: npm run build
      - run: node verify/pack-koreaaitel.mjs release-packages
      - name: Publish @koreaaitel/sdk
        run: npm publish ./release-packages/koreaaitel-sdk-*.tgz --access public --provenance
